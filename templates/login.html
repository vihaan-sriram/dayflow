{% extends "base.html" %}

{% block title %}Sign In - Dayflow HRMS{% endblock %}

{% block content %}
<div class="min-h-full flex flex-col justify-center py-12 sm:px-6 lg:px-8 animate-fade">
    <div class="sm:mx-auto sm:w-full sm:max-w-md">
        <h2 class="mt-6 text-center text-2xl font-black text-slate-900 uppercase tracking-tight">
            Sign in to Dayflow
        </h2>
        <p class="mt-2 text-center text-xs text-slate-500 uppercase tracking-wider font-semibold">
            Or
            <a href="{{ url_for('signup') }}" class="text-blue-600 hover:underline">
                register a new account
            </a>
        </p>
    </div>

    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
        <div class="bg-white py-8 px-4 border border-slate-200 rounded-none sm:px-10 shadow-sm">
            <form class="space-y-6" action="{{ url_for('login') }}" method="POST">
                <!-- Email Address -->
                <div>
                    <label for="email" class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider">
                        Email Address
                    </label>
                    <div class="mt-1">
                        <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@company.com"
                            class="appearance-none block w-full px-3 py-2 border border-slate-300 rounded-none placeholder-slate-400 focus:outline-none focus:ring-slate-950 focus:border-slate-950 sm:text-sm">
                    </div>
                </div>

                <!-- Password -->
                <div>
                    <label for="password" class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider">
                        Password
                    </label>
                    <div class="mt-1">
                        <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="••••••••"
                            class="appearance-none block w-full px-3 py-2 border border-slate-300 rounded-none placeholder-slate-400 focus:outline-none focus:ring-slate-950 focus:border-slate-950 sm:text-sm">
                    </div>
                </div>

                <div class="flex items-center justify-between">
                    <div class="flex items-center">
                        <input id="remember_me" name="remember_me" type="checkbox" checked
                            class="h-4 w-4 text-slate-950 focus:ring-slate-950 border-slate-300 rounded-none">
                        <label for="remember_me" class="ml-2 block text-xs text-slate-700 font-semibold uppercase tracking-wider">
                            Remember me
                        </label>
                    </div>

                    <div class="text-xs font-semibold uppercase tracking-wider">
                        <a href="#" class="text-slate-500 hover:text-slate-900">
                            Forgot Password?
                        </a>
                    </div>
                </div>

                <div>
                    <button type="submit"
                        class="w-full flex justify-center py-2 px-4 border border-transparent text-xs font-bold uppercase rounded-none text-white bg-slate-950 hover:bg-slate-800 transition-colors">
                        Sign in
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
